<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fdfbf6" />
  <meta name="description" content="SOMIS — Student Organization Management and Information System, Marinduque State University OVPSAS." />
  <title>MARSU - SOMIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,700;9..144,0,900;9..144,1,700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #fdfbf6; }
    #root { min-height: 100vh; background: #fdfbf6; }
    .boot-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #fdfbf6;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    .boot-badge {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: #4a0e17;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(74, 14, 23, 0.22);
    }
    .boot-badge img { width: 40px; height: 40px; object-fit: contain; }
    .boot-name { font-size: 20px; font-weight: 900; letter-spacing: -0.02em; color: #4a0e17; }
    .boot-sub { font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #9a7a14; }
    .boot-bar { width: 168px; height: 4px; border-radius: 999px; background: #ece9e0; overflow: hidden; }
    .boot-bar > span {
      display: block; width: 40%; height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4a0e17, #7a1f2d);
      animation: boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes boot-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(420%); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot-shell" aria-hidden="true">
      <div class="boot-badge"><img src="/logo.png" alt="" /></div>
      <div class="boot-name">SOMIS</div>
      <div class="boot-sub">Marinduque State University</div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <noscript>
    <div style="padding:2rem;text-align:center;font-family:sans-serif">
      SOMIS requires JavaScript to run. Please enable JavaScript and reload.
    </div>
  </noscript>
</body>

</html>
